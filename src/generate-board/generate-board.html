<!doctype html>
<html lang="en">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Generate Bingo Board</title>
		<style>
			/* QoL for users to know what elements are clickable */
			a {
				cursor: pointer;
			}

			/* Prevents images from being draggable */
			img {
				-webkit-user-drag: none;
				user-drag: none;
				draggable = false;
				pointer-events: auto;
			}

			/* DARK THEME (default) */
			body {
				--bg: #0b1220;
				--text: #e8eefc;
				--text-1: rgba(255,255,255,0.55);

				--nav-bg: rgba(11, 18, 32, 0.85);
				--nav-border: rgba(255, 255, 255, 0.08);

				--link: #e8eefc;
				--link-hover-bg: rgba(255, 255, 255, 0.08);

				--btn-text: #0b1220;
				--btn-g1: #1dd3ff;
				--btn-g2: #7cff5c;
				--btn-shadow: rgba(92, 124, 255, 0.22);
				--btn-shadow-2: rgba(92, 124, 255, 0.30);
			}

			/* LIGHT THEME */
			body.light {
				--bg: #f6f7fb;
				--text: #0f172a;
				--text-1: rgba(0, 0, 0, 0.35);

				--nav-bg: rgba(246, 247, 251, 0.9);
				--nav-border: rgba(15, 23, 42, 0.08);

				--link: #0f172a;
				--link-hover-bg: rgba(15, 23, 42, 0.06);

				--btn-text: #0b1220;
				--btn-g1: #56f6ff;
				--btn-g2: #6fff5b;
				--btn-shadow: rgba(91, 111, 255, 0.18);
				--btn-shadow-2: rgba(91, 111, 255, 0.26);
			}

			.navigation {
				position: sticky;
				top: 0;
				z-index: 10;
				background: var(--nav-bg);
				backdrop-filter: blur(10px);
				border-bottom: 1px solid var(--nav-border);
			}

			nav.navigation a {
				color: var(--link);
				text-decoration: none;
				font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
				font-weight: 600;
				letter-spacing: 0.2px;
				padding: 10px 12px;
				border-radius: 10px;
				transition:
					background-color 160ms ease,
					transform 160ms ease;
			}

			nav.navigation a:hover {
				background: var(--link-hover-bg);
				transform: translateY(-1px);
			}

			/* Layout unchanged */
			nav.navigation {
				max-width: 1100px;
				margin: 0 auto;
				padding: 14px 18px;
				display: flex;
				align-items: center;
				gap: 18px;
				justify-content: center;
			}

			nav.navigation a#dark-mode {
				margin-left: auto;
				padding: 8px;
				display: inline-flex;
				align-items: center;
				justify-content: center;
			}

			nav.navigation a#dark-mode img {
				width: 22px;
				height: 22px;
				display: block;
			}
			.body {
				min-height: calc(100vh - 60px);
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				padding: 48px 18px;
				text-align: center;
			}
			</style>
			<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 12px;
				background: #f0f4f0;
				font-family: Arial, Helvetica, sans-serif;
			}
			.card {
				max-width: 720px;
				margin: 0 auto;
				border-collapse: collapse;
				border: 3px solid #1a4a2e;
				width: 100%;
			}
			/* Header */
			.card-header {
				background-color: #1a4a2e;
				padding: 24px 20px 18px;
				text-align: center;
			}
			.card-header .subtitle {
				font-size: 10px;
				color: #e8c97a;
				margin: 0 0 4px 0;
			}
			.card-header h1 {
				font-family: Georgia, 'Times New Roman', serif;
				font-size: clamp(32px, 8vw, 48px);
				color: #ffffff;
				line-height: 1;
				margin: 0;
			}
			.card-header h1 span { color: #c9a84c; }
			.card-header .tagline {
				font-size: 10px;
				color: #e8c97a;
				margin: 6px 0 0 0;
			}
			.card-header .rule {
				margin: 8px auto 0;
				width: 50px;
				height: 2px;
				background-color: #c9a84c;
			}
			/* BINGO column headers */
			.bingo-header {
				background-color: #2d6e47;
			}
			.bingo-header table {
				width: 100%;
				border-collapse: collapse;
			}
			.bingo-header td {
				width: 20%;
				padding: 10px 4px;
				text-align: center;
				font-family: Georgia, 'Times New Roman', serif;
				font-size: clamp(18px, 5vw, 26px);
				color: #c9a84c;
			}
			.bingo-header td:not(:last-child) {
				border-right: 1px solid rgba(255,255,255,0.15);
			}
			/* Grid */
			.grid-wrapper { padding: 0; }
			.grid {
				width: 100%;
				border-collapse: collapse;
			}
			.grid td {
				width: 20%;
				border-right: 1px solid #c8d8c8;
				border-bottom: 1px solid #c8d8c8;
				padding: 8px 5px;
				text-align: center;
				vertical-align: middle;
				height: 90px;
			}
			.grid td:last-child { border-right: none; }
			.grid tr:nth-child(odd) td { background-color: #ffffff; }
			.grid tr:nth-child(even) td { background-color: #f7fbf8; }
			.grid td a {
				text-decoration: none;
				display: block;
			}
			.grid td a .icon {
				font-size: 18px;
				display: block;
				margin-bottom: 4px;
			}
			.grid td a .label {
				font-family: Arial, Helvetica, sans-serif;
				font-size: clamp(9px, 1.8vw, 10.5px);
				color: #1a4a2e;
				line-height: 1.3;
				display: block;
			}
			.grid td a .alt {
				font-family: Arial, Helvetica, sans-serif;
				font-size: clamp(8px, 1.6vw, 9px);
				color: #6a6a6a;
				font-style: italic;
				margin-top: 3px;
				display: block;
			}
			/* Footer */
			.card-footer {
				background-color: #1a4a2e;
				padding: 14px 20px;
				text-align: center;
			}
			.card-footer .badge {
				display: inline-block;
				background-color: #c9a84c;
				color: #1a4a2e;
				font-family: Georgia, 'Times New Roman', serif;
				font-size: 13px;
				padding: 5px 16px;
			}
			.card-footer .note {
				font-size: 11px;
				color: #e8c97a;
				margin: 6px 0 0 0;
			}
			/* Instructions box */
			.instructions {
				max-width: 720px;
				margin: 24px auto 0;
				border-collapse: collapse;
				border: 1px solid #d4e4d4;
				width: 100%;
			}
			.instructions td.accent {
				width: 4px;
				background-color: #2d6e47;
				padding: 0;
			}
			.instructions td.body {
				padding: 18px 20px;
				background-color: #ffffff;
			}
			.instructions h2 {
				font-family: Georgia, 'Times New Roman', serif;
				font-size: 17px;
				color: #1a4a2e;
				margin: 0 0 10px 0;
				font-weight: normal;
			}
			.instructions p {
				font-size: 13px;
				color: #2c2c2c;
				line-height: 1.7;
				margin: 0 0 8px 0;
			}
			.instructions p:last-child { margin-bottom: 0; }
			.instructions .tip {
				font-size: 11px;
				color: #666;
				font-style: italic;
				margin: 10px 0 0 0;
				padding-top: 10px;
				border-top: 1px solid #e8e8e8;
			}
			/* Mobile tweaks */
			@media (max-width: 480px) {
				body { padding: 8px; }
				.grid td { height: 70px; padding: 5px 3px; }
				.card-header { padding: 16px 12px 12px; }
				.instructions td.body { padding: 14px; }
			}
		</style>
	</head>

	<body>
		<div class="navigation">
			<nav class="navigation">
				<a href="./../index.html" id="home">Home</a>
				<a href="./..about/about.html" id="about">About</a>
				<a id="dark-mode">
					<img
						src="/assets/enable-light-mode.svg"
						alt="Light Mode Selector"
						id="theme-img"
					/>
				</a>
			</nav>
		</div>
		<div class="body">
			<!-- Bingo Card -->
			<table class="card" cellspacing="0" cellpadding="0">
				<tbody>
					<tr>
						<td class="card-header">
							<p class="subtitle" id="subtitle">
								<!--Date-->
							</p>
							<h1>
								<div id="city"><!--Title--></div><span>Bingo</span>
							</h1>
							<p class="tagline" id="tagline">
								<!--City Name-->
							</p>
							<div class="rule"></div>
						</td>
					</tr>
					<tr>
						<td class="bingo-header">
							<table cellspacing="0" cellpadding="0">
								<tbody>
									<tr>
										<td>B</td>
										<td>I</td>
										<td>N</td>
										<td>G</td>
										<td>O</td>
									</tr>
								</tbody>
							</table>
						</td>
					</tr>
					<tr>
						<td class="grid-wrapper">
							<table class="grid" cellspacing="0" cellpadding="0">
								<tbody id="rows">
									<!--The 5x5 Bingo Board will go here-->
								</tbody>
							</table>
						</td>
					</tr>
					<tr>
						<td class="card-footer">
							<span class="badge"
								>Complete any 3 lines for full credit</span
							>
							<p class="note">
								Document each completed square with a photo or
								brief note
							</p>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
		<script src="../themes.js" type="module"></script>
		<script type="module">
		const { invoke } = window.__TAURI__.core;
		const { save } = window.__TAURI__.dialog;

		// Changes the title based on the city name
		const city = document.getElementById("city");
		const subtitle = document.getElementById("subtitle");
		let boardObj;

		// Gets the generated bingo board from the backend
		try {
			boardObj = await invoke(
				"open_play", { path: sessionStorage.getItem('path') }
			);
		} catch (error) {
			// ERR: Function doesn't exist or board has less than 25 items
			alert("Error loading the board");
			window.location.href = "./../index.html";
		}
		const board = boardObj.board;
		const items = board.items;
		const rows = document.getElementById("rows");
		city.textContent = board.city.split(',')[0];
		subtitle.textContent = board.title;

		let tr = null;
		// Creates the rows of the Bingo Board
		for (let i = 0; i < 25; i++) {
			if (i % 5 === 0) {
				tr = document.createElement("tr");
			}

			const td = document.createElement("td");
			const url = document.createElement("a");
			const emoji = document.createElement("span");
			const title = document.createElement("span");
			const short_description = document.createElement("span");

			emoji.className = "icon";
			title.className = "label";
			short_description.className = "alt";

			let elem = items[i];
			url.href = elem.url;
			url.target = "_blank";
			url.rel = "noopener";

			emoji.textContent = elem.emoji;
			title.textContent = elem.title;
			short_description.textContent = elem.short_description;

			url.appendChild(emoji);
			url.appendChild(title);
			url.appendChild(short_description);

			td.appendChild(url);
			tr.appendChild(td);
			rows.appendChild(tr);
		}
		const date = new Date();
		let path = null;
		do {
			path = await save({
				defaultPath: board.city.split(',')[0].toLowerCase() + "_bingo_" + (date.getFullYear()) + ".html",
				filters: [
					{
						name: "HTML files",
						extensions: ['html'],
					},
				],
			});
		} while (path === null);
		if (path != null) {
			// Removes the JS from the file (must excute last)
			const scriptTags = document.querySelectorAll("script");
	
			scriptTags.forEach(script => {
				script.remove();
			});
			document.querySelector("style").remove();
			document.querySelector("nav").remove();
			const fileContents = document.documentElement.innerHTML;
			invoke("export_html", {path: path, html: fileContents} );
			window.location.href = "./../play-board/play-board.html";
		}
		</script>
</html>
