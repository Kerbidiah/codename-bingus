<!doctype html>
<html lang="en">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Generate Bingo Board</title>
		<style>
			/* QoL for users to know what elements are clickable */
			a {
				cursor: pointer;
			}

			/* Prevents images from being draggable */
			img {
				-webkit-user-drag: none;
				user-drag: none;
				draggable = false;
				pointer-events: auto;
			}

			.navigation {
				position: sticky;
				top: 0;
				z-index: 10;
				background: var(--nav-bg);
				backdrop-filter: blur(10px);
				border-bottom: 1px solid var(--nav-border);
			}

			nav.navigation a {
				color: var(--link);
				text-decoration: none;
				font-weight: 600;
				letter-spacing: 0.2px;
				padding: 10px 12px;
				border-radius: 10px;
				transition:
					background-color 160ms ease,
					transform 160ms ease;
			}

			nav.navigation a:hover {
				background: var(--link-hover-bg);
				transform: translateY(-1px);
			}

			/* Layout unchanged */
			nav.navigation {
				max-width: 1100px;
				margin: 0 auto;
				padding: 14px 18px;
				display: flex;
				align-items: center;
				gap: 18px;
				justify-content: center;
			}

			nav.navigation a#dark-mode {
				margin-left: auto;
				padding: 8px;
				display: inline-flex;
				align-items: center;
				justify-content: center;
			}

			nav.navigation a#dark-mode img {
				width: 22px;
				height: 22px;
				display: block;
			}
			.body {
				min-height: calc(100vh - 60px);
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				padding: 48px 18px;
				text-align: center;
			}
			* {
				box-sizing: border-box;
			}

			/* Theme (DARK default) */
			body {
				margin: 0;
				padding: 12px;
				background: var(--bg, #0b1220);
				color: var(--text, #e8eefc);
				font-family: Arial, Helvetica, sans-serif;

				--nav-bg: rgba(11, 18, 32, 0.85);
				--nav-border: rgba(255, 255, 255, 0.08);

				/* Board-specific tokens mapped to your scheme */
				--header-bg: rgba(255, 255, 255, 0.06);
				--header-bg-soft: var(--nav-bg, rgba(11, 18, 32, 0.85));
				--card-border: var(--nav-border, rgba(255, 255, 255, 0.08));

				--cell-odd: rgba(255, 255, 255, 0.04);
				--cell-even: rgba(255, 255, 255, 0.06);
				--grid-line: rgba(255, 255, 255, 0.12);

				--label-main: var(--text, #e8eefc);
				--label-sub: rgba(232, 238, 252, 0.65);

				--accent-1: var(--btn-g1, #1dd3ff); /* cyan */
				--accent-2: var(--btn-g2, #7cff5c); /* green */
				--gold: var(
					--btn-g2,
					#7cff5c
				); /* replace “gold” usage with scheme */
				--gold-soft: rgba(124, 255, 92, 0.35);

				--radius-lg: 14px;
				--radius-md: 12px;
			}

			body.light {
				--bg: #f6f7fb;
				--text: #0f172a;
				--text-1: rgba(0, 0, 0, 0.35);

				--nav-bg: rgba(246, 247, 251, 0.9);
				--nav-border: rgba(15, 23, 42, 0.08);

				--link: #0f172a;
				--link-hover-bg: rgba(15, 23, 42, 0.06);

				--btn-text: #0b1220;
				--btn-g1: #56f6ff;
				--btn-g2: #6fff5b;
				--btn-shadow: rgba(91, 111, 255, 0.18);
				--btn-shadow-2: rgba(91, 111, 255, 0.26);

				--header-bg-soft: var(--nav-bg, rgba(246, 247, 251, 0.9));
				--card-border: rgba(15, 23, 42, 0.1);

				--cell-odd: #ffffff;
				--cell-even: rgba(15, 23, 42, 0.04);
				--grid-line: rgba(15, 23, 42, 0.1);

				--label-main: #0f172a;
				--label-sub: rgba(15, 23, 42, 0.55);

				--gold: var(--btn-g2, #6fff5b);
				--gold-soft: rgba(111, 255, 91, 0.3);
			}

			.card {
				max-width: 720px;
				margin: 0 auto;
				width: 100%;
				border: 0;
				border-radius: var(--radius-lg);
				overflow: hidden;
				border-spacing: 0;
				background: rgba(255, 255, 255, 0.02);
			}

			/* Header */
			.card-header {
				background-color: var(--header-bg-soft);
				padding: 24px 20px 18px;
				text-align: center;
				border-bottom: 1px solid var(--card-border);
				position: relative;
			}
			/* subtle accent bar */
			.card-header::after {
				content: "";
				position: absolute;
				left: 0;
				right: 0;
				bottom: 0;
				height: 3px;
				background: linear-gradient(
					90deg,
					var(--accent-1),
					var(--gold)
				);
				opacity: 0.9;
			}

			.card-header .subtitle,
			.card-header .tagline {
				font-size: 10px;
				color: var(--gold);
				margin: 0 0 4px 0;
				letter-spacing: 0.2px;
			}

			.card-header h1 {
				font-family: Georgia, "Times New Roman", serif;
				font-size: clamp(32px, 8vw, 48px);
				color: #ffffff;
				line-height: 1;
				margin: 0;
			}
			body.light .card-header h1 {
				color: #0b1220;
			}

			.card-header h1 span {
				color: var(--gold);
			}

			.card-header .rule {
				margin: 8px auto 0;
				width: 50px;
				height: 2px;
				background-color: var(--gold);
			}

			.card-header .rule #generate {
				margin: 0 auto 0;
				width: 60px;
				height: 3px;
				background-color: var(--gold);
			}

			/* BINGO column headers */
			.bingo-header {
				background-color: var(--header-bg-soft);
				border-bottom: 1px solid var(--card-border);
			}

			.bingo-header table {
				width: 100%;
				border-collapse: separate;
				border-spacing: 0;
			}

			.bingo-header td {
				width: 20%;
				padding: 10px 4px;
				text-align: center;
				font-family: Georgia, "Times New Roman", serif;
				font-size: clamp(18px, 5vw, 26px);
				color: var(--gold); /* was green/gold; now scheme green */
				border-right: 1px solid rgba(255, 255, 255, 0.15);
			}

			body.light .bingo-header td {
				border-right: 1px solid rgba(15, 23, 42, 0.12);
			}

			.bingo-header td:last-child {
				border-right: none;
			}

			/* Grid */
			.grid-wrapper {
				padding: 0;
			}

			.grid {
				width: 100%;
				border-collapse: separate;
				border-spacing: 0;
			}

			.grid td {
				width: 20%;
				border-right: 1px solid var(--grid-line);
				border-bottom: 1px solid var(--grid-line);
				padding: 8px 5px;
				text-align: center;
				vertical-align: middle;
				height: 90px;
				background: transparent;
			}

			.grid td:last-child {
				border-right: none;
			}

			.grid tr:nth-child(odd) td {
				background-color: var(--cell-odd);
			}
			.grid tr:nth-child(even) td {
				background-color: var(--cell-even);
			}

			/* rounded outer cells feel */
			.grid tr:first-child td:first-child {
				border-top-left-radius: var(--radius-md);
			}
			.grid tr:first-child td:last-child {
				border-top-right-radius: var(--radius-md);
			}
			.grid tr:last-child td:first-child {
				border-bottom-left-radius: var(--radius-md);
			}
			.grid tr:last-child td:last-child {
				border-bottom-right-radius: var(--radius-md);
			}

			.grid td a {
				text-decoration: none;
				display: block;
				color: inherit;
				border-radius: var(--radius-md);
			}

			.grid td a .icon {
				font-size: 18px;
				display: block;
				margin-bottom: 4px;
				color: var(--accent-1); /* cyan accent for icons */
			}

			.grid td a .label {
				font-family: Arial, Helvetica, sans-serif;
				font-size: clamp(9px, 1.8vw, 10.5px);
				color: var(--gold);
				line-height: 1.3;
				display: block;
			}

			.grid td a .alt {
				font-family: Arial, Helvetica, sans-serif;
				font-size: clamp(8px, 1.6vw, 9px);
				color: var(--label-sub);
				font-style: italic;
				margin-top: 3px;
				display: block;
			}

			/* Footer */
			.card-footer {
				background-color: var(--header-bg-soft);
				padding: 14px 20px;
				text-align: center;
				border-top: 1px solid var(--card-border);
				position: relative;
			}

			.card-footer .badge {
				display: inline-block;
				background: linear-gradient(
					90deg,
					var(--accent-1),
					rgba(124, 255, 92, 0.95)
				);
				color: var(--btn-text, #0b1220);
				font-family: Georgia, "Times New Roman", serif;
				font-size: 13px;
				padding: 5px 16px;
				border-radius: 999px;
				box-shadow: 0 10px 25px
					var(--btn-shadow, rgba(92, 124, 255, 0.2));
			}

			.card-footer .note {
				font-size: 11px;
				color: var(--gold);
				margin: 6px 0 0 0;
			}

			/* Instructions box */
			.instructions {
				max-width: 720px;
				margin: 24px auto 0;
				width: 100%;

				border-collapse: separate;
				border-spacing: 0;

				border: 1px solid var(--card-border);
				border-radius: var(--radius-lg);
				overflow: hidden;

				background: var(--nav-bg, rgba(255, 255, 255, 0.04));
			}

			.instructions td.accent {
				width: 4px;
				background: linear-gradient(
					180deg,
					var(--accent-1),
					var(--gold)
				);
				padding: 0;
			}

			.instructions td.body {
				padding: 18px 20px;
				background-color: transparent;
			}

			.instructions h2 {
				font-family: Georgia, "Times New Roman", serif;
				font-size: 17px;
				color: var(--gold);
				margin: 0 0 10px 0;
				font-weight: normal;
			}

			.instructions p {
				font-size: 13px;
				color: var(--text, #e8eefc);
				line-height: 1.7;
				margin: 0 0 8px 0;
				opacity: 0.9;
			}

			.instructions .tip {
				font-size: 11px;
				color: var(--text-1, rgba(0, 0, 0, 0.35));
				font-style: italic;
				margin: 10px 0 0 0;
				padding-top: 10px;
				border-top: 1px solid var(--card-border);
			}

			/* Mobile tweaks */
			@media (max-width: 480px) {
				body {
					padding: 8px;
				}

				.grid td {
					height: 70px;
					padding: 5px 3px;
				}

				.card-header {
					padding: 16px 12px 12px;
				}
				.instructions td.body {
					padding: 14px;
				}
			}
		</style>
	</head>

	<body>
		<div class="navigation">
			<nav class="navigation">
				<a href="index.html" id="home">Home</a>
				<a href="about/about.html" id="about">About</a>
				<a id="dark-mode">
					<img
						src="/assets/enable-light-mode.svg"
						alt="Light Mode Selector"
						id="theme-img"
					/>
				</a>
			</nav>
		</div>
		<div class="body">
			<!-- Bingo Card -->
			<table class="card" cellspacing="0" cellpadding="0">
				<tbody>
					<tr>
						<td class="card-header">
							<p class="subtitle">
								<!--Date-->
							</p>
							<h1>
								<div id="city">
									<!--Title-->
								</div>
								<span>Bingo</span>
							</h1>
							<p class="tagline">
								<!--City Name-->
							</p>
							<div class="rule"></div>
						</td>
					</tr>
					<tr>
						<td class="bingo-header">
							<table cellspacing="0" cellpadding="0">
								<tbody>
									<tr>
										<td>B</td>
										<td>I</td>
										<td>N</td>
										<td>G</td>
										<td>O</td>
									</tr>
								</tbody>
							</table>
						</td>
					</tr>
					<tr>
						<td class="grid-wrapper">
							<table class="grid" cellspacing="0" cellpadding="0">
								<tbody id="rows">
									<!--The 5x5 Bingo Board will go here-->
								</tbody>
							</table>
						</td>
					</tr>
					<tr>
						<td class="card-footer">
							<span class="badge"
								>Complete any 3 lines for full credit</span
							>
							<p class="note">
								Document each completed square with a photo or
								brief note
							</p>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
		<script type="module">
		const toggle = document.getElementById("dark-mode");
		const theme_img = document.getElementById("theme-img");
		const ICON_LIGHT = "/assets/enable-light-mode.svg";
		const ICON_DARK = "/assets/enable-dark-mode.svg";
		function setTheme(theme) {
			document.body.classList.toggle("light", theme === "light");
			theme_img.src = theme === "light" ? ICON_DARK : ICON_LIGHT;
			localStorage.setItem("theme", theme);
		}
		// Caches the user's theme preference
		const saved = localStorage.getItem("theme");
		if (saved === "light" || saved === "dark") {
			setTheme(saved);
		} else {
			const prefersLight = window.matchMedia(
				"(prefers-color-scheme: light)",
			).matches;
			setTheme(prefersLight ? "light" : "dark");
		}

		toggle.addEventListener("click", (e) => {
			e.preventDefault(); // prevents jumping due to href
			const next = document.body.classList.contains("light") ? "dark" : "light";
			setTheme(next);
		});
		const { invoke } = window.__TAURI__.core;

		// Changes the title based on the city name
		const city = document.getElementById("city");

		// Gets the generated bingo board from the backend
		try {
			const board = await invoke(
				"generate_board", { path: localStorage.getItem('path') }
			);
		} catch (error) {
			// ERR: Function doesn't exist or board has less than 25 items
			window.location.href = "../error/error.html";
		}
		const items = board.items;
		const rows = document.getElementById("rows");
		city.textContent = board.city;

		let tr = null;
		// Creates the rows of the Bingo Board
		for (let i = 0; i < 25; i++) {
			if (i % 5 === 0) {
				tr = document.createElement("tr");
			}

			const td = document.createElement("td");
			const url = document.createElement("a");
			const emoji = document.createElement("span");
			const title = document.createElement("span");
			const short_description = document.createElement("span");

			emoji.className = "icon";
			title.className = "label";
			short_description.className = "alt";

			let elem = items[i];
			url.href = elem.url;
			url.target = "_blank";
			url.rel = "noopener";

			emoji.textContent = elem.emoji;
			title.textContent = elem.title;
			short_description.textContent = elem.short_description;

			url.appendChild(emoji);
			url.appendChild(title);
			url.appendChild(short_description);

			td.appendChild(url);
			tr.appendChild(td);
			rows.appendChild(tr);
		}
		</script>
</html>
