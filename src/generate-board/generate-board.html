<!doctype html>
<html lang="en">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Generate Bingo Board</title>
		<!-- Styles taken from https://people.cs.gmu.edu/~rpettit/vienna_bingo_2026.html -->
		<style>
			* {
				box-sizing: border-box;
			}
			.navigation{
				position: sticky;
				top: 0;
				z-index: 10;
				background: var(--nav-bg);
				backdrop-filter: blur(10px);
				border-bottom: 1px solid var(--nav-border);
			}

			nav.navigation a{
				color: var(--link);
				text-decoration: none;
				font-weight: 600;
				letter-spacing: 0.2px;
				padding: 10px 12px;
				border-radius: 10px;
				transition: background-color 160ms ease, transform 160ms ease;
			}

			nav.navigation a:hover{
				background: var(--link-hover-bg);
				transform: translateY(-1px);
			}

			/* Layout unchanged */
			nav.navigation{
				max-width: 1100px;
				margin: 0 auto;
				padding: 14px 18px;
				display: flex;
				align-items: center;
				gap: 18px;
				justify-content: center;
			}

			nav.navigation a#dark-mode{
				margin-left: auto;
				padding: 8px;
				display: inline-flex;
				align-items: center;
				justify-content: center;
			}

			nav.navigation a#dark-mode img{
				width: 22px;
				height: 22px;
				display: block;
			}
			.body{
				min-height: calc(100vh - 60px);
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				padding: 48px 18px;
				text-align: center;
			}
			/* Theme (DARK default) */
			body {
				margin: 0;
				padding: 12px;
				background: var(--bg, #0b1220);
				color: var(--text, #e8eefc);
				font-family: Arial, Helvetica, sans-serif;

				/* --- shared theme vars for this bingo layout --- */
				--card-border: var(--nav-border, rgba(255, 255, 255, 0.08));
				--panel-bg: rgba(255, 255, 255, 0.03);

				--accent: #1dd3ff; /* fallback if you want to reuse */
				--gold: #e8c97a;

				--header-bg: rgba(
					45,
					110,
					71,
					1
				); /* will be overridden below */
				--header-bg-soft: rgba(45, 110, 71, 0.85);

				/* grid colors */
				--cell-odd: #ffffff;
				--cell-even: #f7fbf8;
				--grid-line: #c8d8c8;

				/* text colors */
				--label-main: #c9a84c;
				--label-sub: rgba(200, 200, 200, 0.95);

				/* rounded corners */
				--radius-lg: 14px;
				--radius-md: 12px;

				/* “table border-collapse” can’t do rounded outer corners cleanly,
       so we use border-spacing + overflow hidden instead. */
			}

			body.light {
				--bg: #f6f7fb;
				--text: #0f172a;
				--text-1: rgba(0, 0, 0, 0.35);

				--nav-bg: rgba(246, 247, 251, 0.9);
				--nav-border: rgba(15, 23, 42, 0.08);

				--link: #0f172a;
				--link-hover-bg: rgba(15, 23, 42, 0.06);

				--btn-text: #0b1220;
				--btn-g1: #56f6ff;
				--btn-g2: #6fff5b;
				--btn-shadow: rgba(91, 111, 255, 0.18);
				--btn-shadow-2: rgba(91, 111, 255, 0.26);

				--card-border: rgba(15, 23, 42, 0.1);

				--header-bg: #2d6e47;
				--header-bg-soft: rgba(45, 110, 71, 0.9);

				--cell-odd: #ffffff;
				--cell-even: #f7fbf8;
				--grid-line: rgba(15, 23, 42, 0.1);

				--label-main: #1a4a2e;
				--label-sub: rgba(15, 23, 42, 0.55);
			}

			/* Set header + panel colors for DARK theme too (default body) */
			body {
				--header-bg: #2d6e47;
				--header-bg-soft: rgba(45, 110, 71, 0.85);

				/* override grid colors for dark */
				--cell-odd: rgba(255, 255, 255, 0.04);
				--cell-even: rgba(255, 255, 255, 0.06);
				--grid-line: rgba(255, 255, 255, 0.12);

				/* match your palette-ish labels */
				--label-main: #c9a84c;
				--label-sub: rgba(255, 255, 255, 0.58);
			}

			.card {
				max-width: 720px;
				margin: 0 auto;
				width: 100%;

				/* rounded outer border */
				border: 0;
				border-radius: var(--radius-lg);
				overflow: hidden;

				/* enables outer padding (so rounded corners don’t get “squared” by table border-collapse) */
				border-spacing: 0;
				background: var(--panel-bg, rgba(255, 255, 255, 0.02));
			}

			/* Header */
			.card-header {
				background-color: var(--header-bg-soft);
				padding: 24px 20px 18px;
				text-align: center;
				border-bottom: 1px solid var(--card-border);
			}

			.card-header .subtitle {
				font-size: 10px;
				color: var(--gold, #e8c97a);
				margin: 0 0 4px 0;
			}

			.card-header h1 {
				font-family: Georgia, "Times New Roman", serif;
				font-size: clamp(32px, 8vw, 48px);
				color: #ffffff;
				line-height: 1;
				margin: 0;
			}

			.card-header h1 span {
				color: var(--gold, #c9a84c);
			}

			.card-header .tagline {
				font-size: 10px;
				color: var(--gold, #e8c97a);
				margin: 6px 0 0 0;
			}

			.card-header .rule {
				margin: 8px auto 0;
				width: 50px;
				height: 2px;
				background-color: var(--gold, #c9a84c);
			}

			/* (Bugfix) your selector had an invalid width unit and typo; kept the intent. */
			.card-header .rule #generate {
				margin: 0 auto 0;
				width: 60px;
				height: 3px;
				background-color: var(--gold, #c9a84c);
			}

			/* BINGO column headers */
			.bingo-header {
				background-color: var(--header-bg-soft);
				border-bottom: 1px solid var(--card-border);
			}

			.bingo-header table {
				width: 100%;
				border-collapse: separate; /* required for outer rounding behavior */
				border-spacing: 0;
			}

			.bingo-header td {
				width: 20%;
				padding: 10px 4px;
				text-align: center;
				font-family: Georgia, "Times New Roman", serif;
				font-size: clamp(18px, 5vw, 26px);
				color: var(--label-main);
				border-right: 1px solid rgba(255, 255, 255, 0.15);
			}

			body.light .bingo-header td {
				border-right: 1px solid rgba(15, 23, 42, 0.12);
			}

			.bingo-header td:last-child {
				border-right: none;
			}

			/* Grid */
			.grid-wrapper {
				padding: 0;
			}

			.grid {
				width: 100%;
				border-collapse: separate; /* lets rounded look better */
				border-spacing: 0;
			}

			.grid td {
				width: 20%;
				border-right: 1px solid var(--grid-line);
				border-bottom: 1px solid var(--grid-line);
				padding: 8px 5px;
				text-align: center;
				vertical-align: middle;
				height: 90px;
				background: transparent;
			}

			.grid td:last-child {
				border-right: none;
			}

			.grid tr:nth-child(odd) td {
				background-color: var(--cell-odd);
			}
			.grid tr:nth-child(even) td {
				background-color: var(--cell-even);
			}

			.grid td a {
				text-decoration: none;
				display: block;
				color: inherit;
				border-radius: var(--radius-md);
			}

			.grid td a .icon {
				font-size: 18px;
				display: block;
				margin-bottom: 4px;
				color: var(--label-main);
			}

			.grid td a .label {
				font-family: Arial, Helvetica, sans-serif;
				font-size: clamp(9px, 1.8vw, 10.5px);
				color: var(--label-main);
				line-height: 1.3;
				display: block;
			}

			.grid td a .alt {
				font-family: Arial, Helvetica, sans-serif;
				font-size: clamp(8px, 1.6vw, 9px);
				color: var(--label-sub);
				font-style: italic;
				margin-top: 3px;
				display: block;
			}

			/* Footer */
			.card-footer {
				background-color: var(--header-bg-soft);
				padding: 14px 20px;
				text-align: center;
				border-top: 1px solid var(--card-border);
			}

			.card-footer .badge {
				display: inline-block;
				background-color: var(--gold, #c9a84c);
				color: #0b1220; /* keeps your dark label; adjust for light below */
				font-family: Georgia, "Times New Roman", serif;
				font-size: 13px;
				padding: 5px 16px;
				border-radius: 999px;
			}

			body.light .card-footer .badge {
				color: #0f172a;
			}

			.card-footer .note {
				font-size: 11px;
				color: var(--gold, #e8c97a);
				margin: 6px 0 0 0;
			}

			/* Instructions box */
			.instructions {
				max-width: 720px;
				margin: 24px auto 0;
				width: 100%;

				border-collapse: separate;
				border-spacing: 0;

				border: 1px solid var(--card-border);
				border-radius: var(--radius-lg);
				overflow: hidden;

				background: var(--nav-bg, rgba(255, 255, 255, 0.04));
			}

			.instructions td.accent {
				width: 4px;
				background-color: var(--header-bg-soft);
				padding: 0;
			}

			.instructions td.body {
				padding: 18px 20px;
				background-color: transparent;
			}

			.instructions h2 {
				font-family: Georgia, "Times New Roman", serif;
				font-size: 17px;
				color: var(--label-main);
				margin: 0 0 10px 0;
				font-weight: normal;
			}

			.instructions p {
				font-size: 13px;
				color: var(--text, #e8eefc);
				line-height: 1.7;
				margin: 0 0 8px 0;
				opacity: 0.9;
			}

			body.light .instructions p {
				opacity: 0.9;
			}

			.instructions p:last-child {
				margin-bottom: 0;
			}

			.instructions .tip {
				font-size: 11px;
				color: var(--text-1, rgba(0, 0, 0, 0.35));
				font-style: italic;
				margin: 10px 0 0 0;
				padding-top: 10px;
				border-top: 1px solid var(--card-border);
			}

			/* Mobile tweaks */
			@media (max-width: 480px) {
				body {
					padding: 8px;
				}

				.grid td {
					height: 70px;
					padding: 5px 3px;
				}

				.card-header {
					padding: 16px 12px 12px;
				}
				.instructions td.body {
					padding: 14px;
				}
			}
		</style>
	</head>

	<body>
		<div class="navigation">
			<nav class="navigation">
				<a href="index.html" id="home">Home</a>
				<a href="about/about.html" id="about">About</a>
				<a id="dark-mode">
					<img
						src="/assets/enable-light-mode.svg"
						alt="Light Mode Selector"
						id="theme-img"
					/>
				</a>
			</nav>
		</div>
		<div class="body">
			<!-- Bingo Card -->
			<table class="card" cellspacing="0" cellpadding="0">
				<tbody>
					<tr>
						<td class="card-header">
							<p class="subtitle">
								<!--GMU Software Engineering Abroad · Summer 2026-->
							</p>
							<h1>
								<div id="city">Vienna</div>
								<span>Bingo</span>
							</h1>
							<p class="tagline">
								<!-- Explore · Discover · Experience -->
							</p>
							<div class="rule"></div>
						</td>
					</tr>
					<tr>
						<td class="bingo-header">
							<table cellspacing="0" cellpadding="0">
								<tbody>
									<tr>
										<td>B</td>
										<td>I</td>
										<td>N</td>
										<td>G</td>
										<td>O</td>
									</tr>
								</tbody>
							</table>
						</td>
					</tr>
					<tr>
						<td class="grid-wrapper">
							<table class="grid" cellspacing="0" cellpadding="0">
								<tbody id="rows">
									<!--The 5x5 Bingo Board will go here-->
								</tbody>
							</table>
						</td>
					</tr>
					<tr>
						<td class="card-footer">
							<span class="badge"
								>Complete any 3 lines for full credit</span
							>
							<p class="note">
								Document each completed square with a photo or
								brief note
							</p>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
		<script type="module">
			const { invoke } = window.__TAURI__.core;

			// Changes the title based on the city name
			const city = document.getElementById("city");

			// Gets the generated bingo board from the backend
			async function generate_board() {
				const dummy_bingo_board_object = await invoke(
					"generate_dummy_bingo_board",
				);
				const board = dummy_bingo_board_object.items;
				const rows = document.getElementById("rows");
				city.textContent = dummy_bingo_board_object.city;
				rows.innerHTML = " ";

				let tr = null;
				// Creates the rows of the Bingo Board
				for (let i = 0; i < board.length; i++) {
					if (i % Math.sqrt(board.length) === 0) {
						tr = document.createElement("tr");
					}

					const td = document.createElement("td");
					const url = document.createElement("a");
					const emoji = document.createElement("span");
					const title = document.createElement("span");
					const short_description = document.createElement("span");

					emoji.className = "icon";
					title.className = "label";
					short_description.className = "alt";

					let elem = board[i];
					url.href = elem.url;
					url.target = "_blank";
					url.rel = "noopener";

					emoji.textContent = elem.emoji;
					title.textContent = elem.title;
					short_description.textContent = elem.short_description;

					url.appendChild(emoji);
					url.appendChild(title);
					url.appendChild(short_description);

					td.appendChild(url);
					tr.appendChild(td);
					rows.appendChild(tr);
				}
			}
		</script>
	</body>
</html>
