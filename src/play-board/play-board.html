<!DOCTYPE html>
<html lang="en">
	<head>
		<title id="title"></title>
		<style>
		/* QoL for users to know what elements are clickable */
		a {
			cursor: pointer;
		}
		/* Prevents images from being draggable */
		img {
			-webkit-user-drag: none;
			user-drag: none;
			draggable = false;
			pointer-events: auto;
		}

		/* DARK THEME (default) */
		body{
			--bg: #0b1220;
			--text: #e8eefc;
			--text-1: rgba(255,255,255,0.55);

			--nav-bg: rgba(11, 18, 32, 0.85);
			--nav-border: rgba(255, 255, 255, 0.08);

			--link: #e8eefc;
			--link-hover-bg: rgba(255, 255, 255, 0.08);

			--btn-text: #0b1220;
			--btn-g1: #1dd3ff;
			--btn-g2: #7cff5c;
			--btn-shadow: rgba(92, 124, 255, 0.22);
			--btn-shadow-2: rgba(92, 124, 255, 0.30);
		}

		/* LIGHT THEME */
		body.light{
			--bg: #f6f7fb;
			--text: #0f172a;
			--text-1: rgba(0, 0, 0, 0.35);

			--nav-bg: rgba(246, 247, 251, 0.9);
			--nav-border: rgba(15, 23, 42, 0.08);

			--link: #0f172a;
			--link-hover-bg: rgba(15, 23, 42, 0.06);

			--btn-text: #0b1220;
			--btn-g1: #56f6ff;
			--btn-g2: #6fff5b;
			--btn-shadow: rgba(91, 111, 255, 0.18);
			--btn-shadow-2: rgba(91, 111, 255, 0.26);
		}
		/* Base styles (shared) */
		body{
			margin: 0;
			font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
			background: var(--bg);
			color: var(--text);
		}

		.navigation{
			position: sticky;
			top: 0;
			z-index: 10;
			background: var(--nav-bg);
			backdrop-filter: blur(10px);
			border-bottom: 1px solid var(--nav-border);
		}

		nav.navigation a{
			color: var(--link);
			text-decoration: none;
			font-weight: 600;
			letter-spacing: 0.2px;
			padding: 10px 12px;
			border-radius: 10px;
			transition: background-color 160ms ease, transform 160ms ease;
		}

		nav.navigation a:hover{
			background: var(--link-hover-bg);
			transform: translateY(-1px);
		}
		
		/* Layout unchanged */
		nav.navigation{
			max-width: 1100px;
			margin: 0 auto;
			padding: 14px 18px;
			display: flex;
			align-items: center;
			gap: 18px;
			justify-content: center;
		}

		nav.navigation a#dark-mode{
			margin-left: auto;
			padding: 8px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
		}

		nav.navigation a#dark-mode img{
			width: 22px;
			height: 22px;
			display: block;
		}
		.body{
			min-height: calc(100vh - 60px);
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			padding: 48px 18px;
			text-align: center;
		}
		</style>
	</head>
	<body>
		<div class="navigation">
			<nav class="navigation">
				<a href="./../index.html" id="home">Home</a>
				<a href="./../about/about.html" id="about">About</a>
				<a id="dark-mode">
					<img
						src="/assets/enable-light-mode.svg"
						alt="Light Mode Selector"
						id="theme-img"
					/>
				</a>
			</nav>
		</div>
		<div class="body">
			
		</div>
	</body>
	<script type="module" src="../themes.js"></script>
</html>
